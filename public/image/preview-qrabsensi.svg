<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e0d"/>
      <stop offset="100%" style="stop-color:#15120a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="340" fill="url(#bg3)" rx="12"/>
  <!-- Browser window -->
  <rect x="30" y="30" width="540" height="280" rx="8" fill="#0d1117" stroke="#00ff4133" stroke-width="1"/>
  <!-- Title bar -->
  <rect x="30" y="30" width="540" height="32" rx="8" fill="#161b22"/>
  <rect x="30" y="54" width="540" height="8" fill="#161b22"/>
  <circle cx="52" cy="46" r="5" fill="#ff5f56"/><circle cx="70" cy="46" r="5" fill="#ffbd2e"/><circle cx="88" cy="46" r="5" fill="#27c93f"/>
  <!-- URL bar -->
  <rect x="120" y="39" width="360" height="14" rx="7" fill="#0d1117"/>
  <text x="300" y="50" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">absenpakaiqr.vercel.app</text>
  <!-- QR Code (pixel art style) -->
  <g transform="translate(220,85)">
    <!-- QR border -->
    <rect x="0" y="0" width="160" height="160" rx="8" fill="#ffffff" opacity="0.05"/>
    <!-- QR pattern -->
    <g fill="#00ff41" opacity="0.7">
      <!-- Top-left finder -->
      <rect x="10" y="10" width="40" height="40"/><rect x="15" y="15" width="30" height="30" fill="#0d1117"/><rect x="20" y="20" width="20" height="20" fill="#00ff41"/>
      <!-- Top-right finder -->
      <rect x="110" y="10" width="40" height="40"/><rect x="115" y="15" width="30" height="30" fill="#0d1117"/><rect x="120" y="20" width="20" height="20" fill="#00ff41"/>
      <!-- Bottom-left finder -->
      <rect x="10" y="110" width="40" height="40"/><rect x="15" y="115" width="30" height="30" fill="#0d1117"/><rect x="20" y="120" width="20" height="20" fill="#00ff41"/>
      <!-- Data modules -->
      <rect x="60" y="10" width="8" height="8"/><rect x="72" y="10" width="8" height="8"/><rect x="84" y="18" width="8" height="8"/>
      <rect x="60" y="26" width="8" height="8"/><rect x="90" y="26" width="8" height="8"/><rect x="100" y="10" width="8" height="8"/>
      <rect x="60" y="42" width="8" height="8"/><rect x="76" y="42" width="8" height="8"/><rect x="92" y="42" width="8" height="8"/>
      <rect x="10" y="60" width="8" height="8"/><rect x="26" y="60" width="8" height="8"/><rect x="42" y="60" width="8" height="8"/>
      <rect x="60" y="60" width="8" height="8"/><rect x="76" y="60" width="8" height="8"/><rect x="92" y="60" width="8" height="8"/>
      <rect x="110" y="60" width="8" height="8"/><rect x="126" y="60" width="8" height="8"/><rect x="142" y="60" width="8" height="8"/>
      <rect x="10" y="76" width="8" height="8"/><rect x="42" y="76" width="8" height="8"/><rect x="60" y="76" width="8" height="8"/>
      <rect x="84" y="76" width="8" height="8"/><rect x="110" y="76" width="8" height="8"/><rect x="142" y="76" width="8" height="8"/>
      <rect x="26" y="92" width="8" height="8"/><rect x="60" y="92" width="8" height="8"/><rect x="76" y="92" width="8" height="8"/>
      <rect x="100" y="92" width="8" height="8"/><rect x="126" y="92" width="8" height="8"/>
      <rect x="60" y="110" width="8" height="8"/><rect x="84" y="110" width="8" height="8"/><rect x="100" y="118" width="8" height="8"/>
      <rect x="60" y="130" width="8" height="8"/><rect x="76" y="130" width="8" height="8"/><rect x="110" y="130" width="8" height="8"/>
      <rect x="60" y="142" width="8" height="8"/><rect x="92" y="142" width="8" height="8"/><rect x="126" y="142" width="8" height="8"/>
    </g>
    <!-- Scan line animation -->
    <line x1="5" y1="0" x2="155" y2="0" stroke="#00ff41" stroke-width="2" opacity="0.5">
      <animate attributeName="y1" values="0;160;0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="0;160;0" dur="3s" repeatCount="indefinite"/>
    </line>
  </g>
  <!-- Text labels -->
  <text x="150" y="130" fill="#8b949e" font-family="monospace" font-size="11" opacity="0.5">Scan QR</text>
  <text x="150" y="148" fill="#00ff41" font-family="monospace" font-size="11" opacity="0.5">to Absent</text>
  <!-- Bottom bar -->
  <rect x="30" y="280" width="540" height="30" rx="0" fill="#161b2280"/>
  <rect x="30" y="302" width="540" height="8" rx="0 0 8 8" fill="#161b2280"/>
  <text x="50" y="299" fill="#00ff41" font-family="monospace" font-size="10" opacity="0.6">QR Absensi System</text>
  <text x="560" y="299" text-anchor="end" fill="#8b949e" font-family="monospace" font-size="10">Node.js + Supabase</text>
</svg>
