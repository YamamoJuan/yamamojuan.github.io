<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e0d"/>
      <stop offset="100%" style="stop-color:#0d1520"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="340" fill="url(#bg2)" rx="12"/>
  <!-- Browser window -->
  <rect x="30" y="30" width="540" height="280" rx="8" fill="#0d1117" stroke="#00ff4133" stroke-width="1"/>
  <!-- Title bar -->
  <rect x="30" y="30" width="540" height="32" rx="8" fill="#161b22"/>
  <rect x="30" y="54" width="540" height="8" fill="#161b22"/>
  <circle cx="52" cy="46" r="5" fill="#ff5f56"/><circle cx="70" cy="46" r="5" fill="#ffbd2e"/><circle cx="88" cy="46" r="5" fill="#27c93f"/>
  <!-- URL bar -->
  <rect x="120" y="39" width="360" height="14" rx="7" fill="#0d1117"/>
  <text x="300" y="50" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">sharingfilesementara.vercel.app</text>
  <!-- Upload area -->
  <rect x="150" y="90" width="300" height="140" rx="12" fill="none" stroke="#00ff41" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.4"/>
  <!-- Upload icon -->
  <g transform="translate(300,145)" opacity="0.5">
    <path d="M0,-30 L15,-10 L8,-10 L8,15 L-8,15 L-8,-10 L-15,-10 Z" fill="#00ff41"/>
    <line x1="0" y1="15" x2="0" y2="30" stroke="#00ff41" stroke-width="3"/>
    <line x1="-12" y1="30" x2="12" y2="30" stroke="#00ff41" stroke-width="3"/>
  </g>
  <text x="300" y="195" text-anchor="middle" fill="#00ff41" font-family="monospace" font-size="13" opacity="0.7">Drop files here or click to upload</text>
  <text x="300" y="215" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="10">Max file size: 50MB</text>
  <!-- Bottom bar -->
  <rect x="30" y="280" width="540" height="30" rx="0" fill="#161b2280"/>
  <rect x="30" y="302" width="540" height="8" rx="0 0 8 8" fill="#161b2280"/>
  <text x="50" y="299" fill="#00ff41" font-family="monospace" font-size="10" opacity="0.6">Next.js + Supabase</text>
  <text x="560" y="299" text-anchor="end" fill="#8b949e" font-family="monospace" font-size="10">TypeScript</text>
</svg>
