<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e0d"/>
      <stop offset="100%" style="stop-color:#111a17"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="340" fill="url(#bg1)" rx="12"/>
  <!-- Grid lines -->
  <g opacity="0.04" stroke="#00ff41" stroke-width="0.5">
    <line x1="0" y1="50" x2="600" y2="50"/><line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="150" x2="600" y2="150"/><line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="250" x2="600" y2="250"/><line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="340"/><line x1="200" y1="0" x2="200" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/><line x1="400" y1="0" x2="400" y2="340"/>
    <line x1="500" y1="0" x2="500" y2="340"/>
  </g>
  <!-- Terminal window -->
  <rect x="30" y="30" width="540" height="280" rx="8" fill="#0d1117" stroke="#00ff4133" stroke-width="1"/>
  <!-- Title bar -->
  <rect x="30" y="30" width="540" height="32" rx="8" fill="#161b22"/>
  <rect x="30" y="54" width="540" height="8" fill="#161b22"/>
  <circle cx="52" cy="46" r="5" fill="#ff5f56"/><circle cx="70" cy="46" r="5" fill="#ffbd2e"/><circle cx="88" cy="46" r="5" fill="#27c93f"/>
  <text x="300" y="50" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="11">Go CLI Simulator — gonano</text>
  <!-- Terminal content -->
  <text x="50" y="90" fill="#00ff41" font-family="monospace" font-size="12" opacity="0.7">$ gonano main.go</text>
  <text x="50" y="115" fill="#58a6ff" font-family="monospace" font-size="12"> 1  package main</text>
  <text x="50" y="135" fill="#58a6ff" font-family="monospace" font-size="12"> 2  </text>
  <text x="50" y="155" fill="#58a6ff" font-family="monospace" font-size="12"> 3  func main() {</text>
  <text x="50" y="175" fill="#79c0ff" font-family="monospace" font-size="12"> 4      fmt.Println("Hello, World!")</text>
  <text x="50" y="195" fill="#58a6ff" font-family="monospace" font-size="12"> 5  }</text>
  <!-- Cursor -->
  <rect x="50" y="210" width="8" height="14" fill="#00ff41" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
  </rect>
  <!-- Status bar -->
  <rect x="30" y="280" width="540" height="30" rx="0" fill="#161b2280"/>
  <rect x="30" y="302" width="540" height="8" rx="0 0 8 8" fill="#161b2280"/>
  <text x="50" y="299" fill="#00ff41" font-family="monospace" font-size="10" opacity="0.6">▶ gonano | Ctrl+R: Run | Ctrl+X: Exit</text>
  <text x="560" y="299" text-anchor="end" fill="#8b949e" font-family="monospace" font-size="10">Go 1.21+</text>
</svg>
